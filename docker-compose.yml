services:
  walvoil-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: walvoil-dpr-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost
      - MAX_FILE_SIZE_MB=10
      - MAX_IMAGE_WIDTH=8192
      - MAX_IMAGE_HEIGHT=8192
      - CONCURRENCY_LIMIT=4
      - LOG_LEVEL=INFO
      - MODEL_CACHE_DIR=/app/.cache
      - HF_HOME=/app/.cache/huggingface
      - AUTO_DOWNLOAD_MODELS=false
    volumes:
      # Persistent external storage for model weights outside image
      - ./backend/.cache:/app/.cache
      # Persistent application logs
      - ./backend/logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    networks:
      - walvoil-network

networks:
  walvoil-network:
    driver: bridge

